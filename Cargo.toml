[package]
name = "bad-apple-rs"
version = "0.1.1"
edition = "2021"

[features]
default = []
audio = [ "rodio" ]

[dependencies.fbgl]
features = ["fbdev", "img"]
git = "https://github.com/abc123me/fbgl-rs.git"
tag = "v0.2.3"

[dependencies.clap]
features = ["derive"]
version = "4.5.56"

[dependencies.rodio]
version = "0.21.1"
optional = true

[dependencies]
crossbeam = "0.8.4"
framebuffer = "0.3.1"
image = "0.25.9"
